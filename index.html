<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ちゃとた競馬AI v12</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#20242a;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:#111827;color:#fff;padding:18px 16px}main{max-width:760px;margin:auto;padding:12px}.card{background:#fff;border-radius:15px;padding:16px;margin:12px 0;box-shadow:0 2px 10px rgba(0,0,0,.07)}h3{margin:0 0 12px}input[type=text]{width:100%;padding:13px;border:1px solid #ccd1d8;border-radius:10px;font-size:14px}button{margin-top:8px;border:0;border-radius:10px;padding:12px 16px;background:#111827;color:#fff;font-weight:700}.horse{padding:12px 0;border-bottom:1px solid #eee}.horseline{display:flex;gap:9px;align-items:center}.horse input{margin-top:2px}.num{font-weight:800;min-width:52px;display:inline-block}.meta{font-size:13px;color:#4f5968;margin-left:75px;margin-top:3px}.small{font-size:12px;color:#697386}.summary{line-height:1.8}.airow{padding:12px 0;border-bottom:1px solid #eee}.badge{display:inline-block;width:28px;font-weight:900}.reason{font-size:13px;color:#596273;margin-top:4px;line-height:1.5}
</style></head><body><header><strong>🏇 ちゃとた競馬AI v12</strong><div class="small" style="color:#d1d5db">出馬表取得・馬番・騎手・斤量・AI分析</div></header><main>
<div class="card"><h3>① レースを読み込む</h3><input id="url" type="text" value="https://race.sp.netkeiba.com/race/shutuba.html?race_id=202606040611"><button id="load">レース情報を取得</button><div id="status" class="small"></div></div>
<div class="card"><h3>② 出走馬</h3><div id="raceTitle" class="small">まだ読み込まれていません</div><div id="horses"></div></div>
<div class="card"><h3>③ BOX点数</h3><div class="summary">選択頭数：<b><span id="count">0</span>頭</b><br>馬連BOX：<b><span id="umaren">0</span>点</b>（¥<span id="uy">0</span>）<br>3連複BOX：<b><span id="sanren">0</span>点</b>（¥<span id="sy">0</span>）</div></div>
<div class="card"><h3>④ AI分析</h3><div id="ai" class="small">レースを読み込むと暫定評価を表示します。</div></div>
</main><script>
const $=id=>document.getElementById(id);
function comb(n,r){if(n<r)return 0;let x=1;for(let i=1;i<=r;i++)x=x*(n-r+i)/i;return Math.round(x)}
function update(){let n=document.querySelectorAll('#horses input:checked').length,u=comb(n,2),s=comb(n,3);$('count').textContent=n;$('umaren').textContent=u;$('uy').textContent=u*100;$('sanren').textContent=s;$('sy').textContent=s*100}
function makeAI(h){let labs=['◎','○','▲','☆'],out='<div class="small">現段階は取得した出馬表データによる暫定分析です。調教・過去走・馬場・正式オッズを追加して評価を高度化します。</div>';h.slice(0,4).forEach((x,i)=>{out+=`<div class="airow"><span class="badge">${labs[i]}</span><b>${x.number!=null?x.number+'番 ':''}${x.name}</b><div class="reason">騎手：${x.jockey||'未取得'} ／ 斤量：${x.weight||'未取得'}${x.odds?' ／ オッズ：'+x.odds:''}</div></div>`});return out}
$('load').onclick=async()=>{let b=$('load');b.disabled=true;$('status').textContent='取得中…';try{let r=await fetch('/api/race',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:$('url').value.trim()})}),d=await r.json();if(!r.ok)throw Error(d.error||'取得に失敗しました');$('raceTitle').innerHTML=`${d.title}<br><b>${d.horses.length}頭取得</b>`;$('horses').innerHTML='';d.horses.forEach(h=>{let e=document.createElement('label');e.className='horse';e.innerHTML=`<div class="horseline"><input type="checkbox"><span class="num">${h.number!=null?h.number+'番':'番号未取得'}</span><b>${h.name}</b></div><div class="meta">騎手：${h.jockey||'未取得'}　斤量：${h.weight||'未取得'}${h.odds?'　オッズ：'+h.odds:''}</div>`;e.querySelector('input').onchange=update;$('horses').appendChild(e)});$('status').textContent=`✅ 取得完了：${d.horses.length}頭`;$('ai').innerHTML=makeAI(d.horses);update()}catch(e){$('status').textContent='⚠️ '+e.message}finally{b.disabled=false}}
</script></body></html>
