<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ちゃとた競馬AI v8</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f5f7;color:#20242a;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#111827;color:#fff;padding:18px 16px}
main{max-width:760px;margin:auto;padding:12px}
.card{background:#fff;border-radius:15px;padding:16px;margin:12px 0;box-shadow:0 2px 10px rgba(0,0,0,.07)}
h2,h3{margin:0 0 12px}
input[type=text]{width:100%;padding:13px;border:1px solid #ccd1d8;border-radius:10px;font-size:14px}
button{margin-top:8px;border:0;border-radius:10px;padding:12px 16px;background:#111827;color:white;font-weight:700}
button:disabled{opacity:.55}
.status{margin-top:10px;font-size:13px}
.ok{font-weight:700}
.warn{color:#9a6700}
.horse{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid #eee}
.horse:last-child{border-bottom:0}
.horse input{margin-top:4px}
.num{font-weight:800;display:inline-block;min-width:42px}
.small{font-size:12px;color:#697386}
.airow{padding:12px 0;border-bottom:1px solid #eee}
.airow:last-child{border-bottom:0}
.badge{display:inline-block;width:28px;font-weight:900}
.reason{font-size:13px;color:#596273;margin-top:4px;line-height:1.5}
.summary{line-height:1.8}
</style>
</head>
<body>
<header>
  <strong>🏇 ちゃとた競馬AI v8</strong>
  <div class="small" style="color:#d1d5db">出馬表取得・買い目計算・AI分析</div>
</header>

<main>
<div class="card">
  <h3>① レースを読み込む</h3>
  <input id="url" type="text" value="https://race.sp.netkeiba.com/race/shutuba.html?race_id=202606040611">
  <button id="load">レース情報を取得</button>
  <div id="status" class="status"></div>
</div>

<div class="card">
  <h3>② 出走馬</h3>
  <div id="raceTitle" class="small">まだ読み込まれていません</div>
  <div id="horses"></div>
</div>

<div class="card">
  <h3>③ BOX点数</h3>
  <div class="summary">
    選択頭数：<b><span id="count">0</span>頭</b><br>
    馬連BOX：<b><span id="umaren">0</span>点</b>（¥<span id="uy">0</span>）<br>
    3連複BOX：<b><span id="sanren">0</span>点</b>（¥<span id="sy">0</span>）
  </div>
</div>

<div class="card">
  <h3>④ AI分析</h3>
  <div id="ai" class="small">レースを読み込むと暫定評価を表示します。</div>
</div>
</main>

<script>
const $=id=>document.getElementById(id);

function comb(n,r){
  if(n<r)return 0;
  let x=1;
  for(let i=1;i<=r;i++)x=x*(n-r+i)/i;
  return Math.round(x);
}

function updateCounts(){
  const n=document.querySelectorAll('#horses input[type=checkbox]:checked').length;
  const u=comb(n,2), s=comb(n,3);
  $('count').textContent=n;
  $('umaren').textContent=u;
  $('uy').textContent=u*100;
  $('sanren').textContent=s;
  $('sy').textContent=s*100;
}

function makeAI(horses){
  if(!horses.length)return '<div class="small">出走馬を取得できませんでした。</div>';

  const labels=['◎','○','▲','☆'];
  let out='<div class="small">現在は出馬表から取得できた馬番・馬名を中心にした「暫定AI分析」です。調教、過去走、斤量、騎手、馬場、正式オッズなどを取得できるようになった段階で評価精度を上げます。</div>';

  horses.slice(0,4).forEach((h,i)=>{
    out+=`<div class="airow">
      <span class="badge">${labels[i]}</span>
      <b>${h.number!=null ? h.number+'番 ' : ''}${h.name}</b>
      <div class="reason">${h.number!=null ? '馬番・馬名を正常取得。' : '馬名は取得できましたが馬番を確認できていません。'}現段階では基礎データ確認による暫定評価です。</div>
    </div>`;
  });
  return out;
}

$('load').onclick=async()=>{
  const btn=$('load');
  btn.disabled=true;
  $('status').textContent='取得中…';

  try{
    const res=await fetch('/api/race',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({url:$('url').value.trim()})
    });
    const data=await res.json();
    if(!res.ok)throw new Error(data.error||'取得に失敗しました');

    $('raceTitle').innerHTML=`${data.title}<br><b class="ok">${data.horses.length}頭取得</b>`;
    $('horses').innerHTML='';

    data.horses.forEach(h=>{
      const label=document.createElement('label');
      label.className='horse';
      const number=h.number!=null ? h.number+'番' : '番号未取得';
      label.innerHTML=`<input type="checkbox"><div><span class="num">${number}</span>${h.name}</div>`;
      label.querySelector('input').addEventListener('change',updateCounts);
      $('horses').appendChild(label);
    });

    $('status').innerHTML=`✅ 取得完了：<b>${data.horses.length}頭</b>`;
    $('ai').innerHTML=makeAI(data.horses);
    updateCounts();

  }catch(e){
    $('status').textContent='⚠️ '+e.message;
  }finally{
    btn.disabled=false;
  }
};
</script>
</body>
</html>
